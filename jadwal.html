<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    color:white;
    min-height:100vh;

    background:

/* ================= NAV ================= */

nav{
    position:absolute;
    top:25px;
    left:50%;
    transform:translateX(-50%);

    display:flex;
    justify-content:center;
    align-items:center;

    gap:8px;

    z-index:10;
}

nav a{
    color:white;
    text-decoration:none;

    padding:10px 20px;

    border-radius:8px;

    font-weight:bold;

    transition:.3s;
}

nav a:hover{
    background:#d00000;
}


/* ================= HEADER ================= */

header{
    text-align:center;

    padding:105px 20px 35px;
}

header h1{
    font-size:43px;

    font-weight:900;

    letter-spacing:2px;
}

header p{
    margin-top:8px;

    color:#ccc;
}


/* ================= GRID ================= */

.calendar{
    width:94%;
    max-width:1250px;

    margin:auto;

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:22px;
}


/* ================= CARD ================= */

.gp-card{

    background:
    rgba(5,5,8,.96);

    border:
    2px solid #333;

    border-radius:15px;

    overflow:hidden;

    box-shadow:
    0 8px 25px rgba(0,0,0,.5);

    transition:.3s;
}

.gp-card:hover{

    transform:
    translateY(-4px);

    border-color:
    #e00000;
}


/* ================= INFO ================= */

.gp-info{

    padding:
    18px 18px 12px;
}

.round{

    display:inline-block;

    background:#ff4b25;

    padding:
    7px 12px;

    border-radius:6px;

    font-size:12px;

    font-weight:bold;

    margin-bottom:10px;
}

.gp-name{

    display:flex;

    align-items:center;

    gap:9px;

    font-size:25px;

    font-weight:900;
}

.flag{

    font-size:27px;
}

.circuit-name{

    color:#ccc;

    margin-top:5px;

    font-size:14px;
}

.date{

    margin-top:12px;

    font-size:14px;

    font-weight:bold;
}


/* ================= FOTO PEMBALAP ================= */

.rider-photo{

    width:100%;

    height:250px;

    background:#111;

    overflow:hidden;

    position:relative;
}

.rider-photo img{

    width:100%;

    height:100%;

    object-fit:cover;

    object-position:
    center 20%;

    display:block;
}


/* nama pembalap */

.rider-name{

    position:absolute;

    left:12px;

    bottom:12px;

    background:
    rgba(0,0,0,.78);

    padding:
    8px 12px;

    border-radius:7px;

    font-size:13px;

    font-weight:bold;

    border-left:
    4px solid #e00000;
}


/* kalau gambar gagal */

.no-photo{

    width:100%;
    height:100%;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    color:#999;

    text-align:center;
}

.no-photo .icon{

    font-size:55px;

    margin-bottom:8px;
}


/* ================= SESSION ================= */

.sessions{

    padding:12px;

    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:7px;
}

.session{

    background:#111;

    border-radius:7px;

    padding:10px;

    font-size:12px;

    display:flex;

    justify-content:space-between;

    gap:5px;
}

.practice{
    border-left:
    4px solid #00aaff;
}

.qualifying{
    border-left:
    4px solid #bbaaff;
}

.sprint{
    border-left:
    4px solid #ff5533;
}

.race{
    border-left:
    4px solid #35d36b;
}

.session strong{
    color:#ddd;
}

.session span{
    font-weight:bold;
}


/* ================= RECORD ================= */

.record{

    margin:
    0 12px 14px;

    padding:12px;

    background:
    rgba(100,0,0,.55);

    border:
    1px solid #a52b2b;

    border-radius:8px;
}

.record-title{

    color:#ff7b69;

    font-size:11px;

    font-weight:bold;

    margin-bottom:5px;
}

.record-text{

    font-size:13px;

    font-weight:bold;
}


/* ================= FOOTER ================= */

footer{

    text-align:center;

    color:#aaa;

    margin-top:35px;

    font-size:13px;
}


/* ================= HP ================= */

@media(max-width:750px){

    nav{

    }

    nav a{

    }

    }

        font-size:31px;
    }

        grid-template-columns:1fr;
    }

    .rider-photo{

    }
}

/* =================================================
   MENGAMBIL FOTO PEMBALAP
   ================================================= */

async function loadRiderPhoto(r,index){

    const box =
    document.getElementById(
        "photo-"+index
    );


    try{

        const url =
        "https://en.wikipedia.org/api/rest_v1/page/summary/"
        +
        encodeURIComponent(r.wiki);


        const response =
        await fetch(url);


        if(!response.ok)
            throw new Error();


        const data =
        await response.json();


        if(
            !data.thumbnail ||
            !data.thumbnail.source
        ){

            throw new Error();

        }


        const img =
        document.createElement("img");


        img.src =
        data.thumbnail.source;


        img.alt =
        "Foto " + r.rider;


        img.loading =
        "lazy";


        img.onerror =
        function(){

            showFallback(
                box,
                r.rider
            );

        };


        box.innerHTML = "";


        box.appendChild(img);


        const name =
        document.createElement("div");


        name.className =
        "rider-name";


        name.textContent =
        "🏍️ " + r.rider;


        box.appendChild(name);


    }

    catch(error){

        showFallback(
            box,
            r.rider
        );

    }

}


/* =================================================
   JIKA FOTO TIDAK TERSEDIA
   ================================================= */

function showFallback(box,name){

    box.innerHTML = `

        <div class="no-photo">

            <span class="icon">
                🏍️
            </span>

            <span>
                ${name}
            </span>

        </div>

    `;

}
